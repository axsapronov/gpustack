# Development docker-compose for GPUStack
# Mount persistent data volume for database storage.
# Volume mounts for gpustack-lb integration patches (overriding individual files).
# Set UV_EXTRA_INDEX_URL (or PIP_EXTRA_INDEX_URL) in .env for private Nexus PyPI if needed.
services:
  gpustack:
    image: gpustack/gpustack:dev
    container_name: gpustack
    restart: unless-stopped
    network_mode: host
    volumes:
      # Persistent data
      - gpustack-data:/var/lib/gpustack
      # gpustack-lb integration patches (thin adapter + updated imports)
      - ./gpustack/http_proxy/gpustack_lb_adapter.py:/usr/local/lib/python3.11/dist-packages/gpustack/http_proxy/gpustack_lb_adapter.py
      - ./gpustack/routes/openai.py:/usr/local/lib/python3.11/dist-packages/gpustack/routes/openai.py
      # Lifespan: start/stop LB metrics cache
      - ./gpustack/server/app.py:/usr/local/lib/python3.11/dist-packages/gpustack/server/app.py
      # Bind API/proxy on 0.0.0.0 (port 30080) — required for external access with host networking
      - ./gpustack/server/server.py:/usr/local/lib/python3.11/dist-packages/gpustack/server/server.py
      - ./gpustack/config/config.py:/usr/local/lib/python3.11/dist-packages/gpustack/config/config.py
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        INDEX_URL="$${UV_EXTRA_INDEX_URL:-$${PIP_EXTRA_INDEX_URL:-}}"
        echo "[INFO] Installing gpustack-lb..."
        if [ -n "$${INDEX_URL}" ]; then
          export INDEX_URL
          INDEX_HOST="$$(python3 -c 'from urllib.parse import urlparse; import os; print(urlparse(os.environ["INDEX_URL"]).hostname or "")')"
          # HTTP Nexus is ignored by pip unless --trusted-host is set.
          python3 -m pip install "gpustack-lb>=0.1.3" --extra-index-url "$${INDEX_URL}" --trusted-host "$${INDEX_HOST}"
        else
          python3 -m pip install "gpustack-lb>=0.1.3"
        fi
        echo "[INFO] Starting GPUStack server..."
        exec /usr/bin/entrypoint.sh --database-url ${GPUSTACK_DATABASE_URL} --disable-worker --server-external-url ${GPUSTACK_SERVER_EXTERNAL_URL:-http://localhost}
    env_file:
      - .env
    healthcheck:
      test: curl --fail ${GPUSTACK_SERVER_EXTERNAL_URL:-http://localhost}/healthz || exit 1
      interval: 10s
      retries: 5
      start_period: 60s
      timeout: 10s

volumes:
  gpustack-data:
